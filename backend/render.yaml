services:
  - type: web
    name: enterprise-doc-ai-backend
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: GROQ_API_KEY
        scope: project
      - key: PYTHONUNBUFFERED
        value: "1"